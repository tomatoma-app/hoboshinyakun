<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ほぼしんや君｜時間割変更アシスタント</title><meta name="description" content="Excelの時間割をブラウザー内で変更。インストール不要。"><link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%2323754e'/%3E%3Cpath d='M8 9h16v16H8zM8 14h16M13 9v16M19 9v16' fill='none' stroke='white' stroke-width='2'/%3E%3C/svg%3E"><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;500;700;800&display=swap" rel="stylesheet"><link rel="stylesheet" href="style.css?v=20260920-gradefix1"></head>
<body><input id="file" type="file" accept=".xlsx" hidden>
<span id="runtime" hidden></span>
<main><section id="welcome"><section id="startupPanel" aria-label="起動の進行状況"><div class="startupHeading"><strong id="startupStage" role="status">実行部品を読み込んでいます</strong><span id="startupSteps">0 / 4段階完了</span></div><progress id="startupProgress" max="4" value="0" aria-label="起動の準備段階"></progress><div class="startupTimes"><span id="startupElapsed">経過 0秒</span><span id="startupEstimate">初回のため所要時間を計測しています</span></div></section><div class="startupTitleCard"><p class="appTitle">時間割変更アシスタント</p><h1>ほぼしんや君</h1></div><div class="welcomeActions"><button id="open2" class="primary" disabled>Excelを選んでスタート</button><button id="helpButton">使い方</button></div></section>
<section id="workspace" hidden><div class="topbar"><nav role="tablist"><button role="tab" data-tab="edit" aria-selected="true">条件登録</button><button role="tab" data-tab="result" aria-selected="false">変更された時間割 <span id="count" hidden>0</span></button><button role="tab" data-tab="settings" aria-selected="false">詳細条件</button></nav><div id="resultControls" hidden><label><input type="radio" name="view" id="afterView" checked>変更後</label><label><input type="radio" name="view" id="originalView">元の時間割</label><label><input type="checkbox" id="onlyChanged">変更がある先生だけ</label></div><div id="candidateBar" hidden><label>候補 <select id="candidates" disabled></select></label><button id="candidateList" disabled>一覧</button><span id="candidateSummary"></span></div><div id="editInfo"><strong id="filename"></strong></div><div class="legend"><span class="changed">変更箇所</span><span class="absent">空き指定</span><span class="fixed">固定</span><span class="violation">条件違反</span></div><button type="button" data-fullscreen>全画面表示</button></div>
<div id="gridPanel"><div id="tableWrap" tabindex="0" aria-label="時間割表"><table id="grid"></table></div></div>
<div id="settings" hidden></div>
<div id="information"><div id="selectionInfo" aria-live="polite"></div></div><footer id="toolbar"><div class="viewtools"><button id="fit">全体表示</button><button id="zoomOut" aria-label="縮小">－</button><span id="zoomLabel">100%</span><button id="zoomIn" aria-label="拡大">＋</button><button id="actualSize">100%</button></div><div class="mainactions"><button id="undo">戻す</button><button id="search" class="primary">変更開始</button><button id="apply" disabled>確定</button><button id="saveBottom">保存</button><button id="openBottom">別のエクセルを選択</button></div></footer>
</section></main><div id="status" role="status" aria-live="polite">実行部品を準備しています…</div>
<dialog id="timeDialog"><h2>検索時間を選んでください</h2><div class="timechoices"><button data-mode="quick"><b>短め</b><span>最大30秒</span></button><button data-mode="standard"><b>標準</b><span>最大2分</span></button><button data-mode="careful"><b>じっくり</b><span>最大5分</span></button></div><button id="closeTime">キャンセル</button></dialog>
<dialog id="progressDialog"><h2 id="progressTitle">変更案を検索しています</h2><p><strong id="solutions">0</strong> 件の案が見つかりました</p><progress id="progress" max="100" value="0"></progress><p id="elapsed">0秒</p><button id="cancel">検索を中止</button></dialog>
<dialog id="messageDialog"><h2 id="messageTitle"></h2><p id="messageText"></p><div><button id="messageCancel">キャンセル</button><button id="messageOK" class="primary">OK</button></div></dialog>
<dialog id="saveDialog"><h2>名前を付けて保存</h2><label>ファイル名 <input id="saveName" type="text"></label><p>保存先はブラウザーのダウンロード設定に従います。</p><button id="saveCancel">キャンセル</button><button id="saveOK" class="primary">保存する</button></dialog>
<div id="contextMenu" role="menu" hidden><button role="menuitem" data-action="swap">選択した2コマを入れ替え</button><hr><button role="menuitem" data-action="empty">空きコマにする（授業を移動）</button><button role="menuitem" data-action="study">空きコマにする（自習対応）</button><button role="menuitem" data-action="allow">空きコマ指定を解除</button><hr><button role="menuitem" data-action="fixed">固定する</button><button role="menuitem" data-action="unfixed">固定を解除</button><hr><button role="menuitem" data-action="delete">授業を削除</button><button role="menuitem" data-action="lesson">クラス・教科を設定…</button></div>
<dialog id="lessonDialog"><h2>クラス・教科を設定</h2><p id="lessonSummary"></p><label>クラス <input id="lessonClass" list="classOptions" autocomplete="off"></label><datalist id="classOptions"></datalist><label>教科 <input id="lessonSubject" list="subjectOptions" autocomplete="off"></label><datalist id="subjectOptions"></datalist><p id="lessonError" role="alert"></p><div><button id="lessonCancel">キャンセル</button><button id="lessonApply" class="primary">設定</button></div></dialog>
<dialog id="candidateDialog"><h2>条件に合う候補・上位10件</h2><p>①変更コマ数 ②関わる先生の人数が少ない順です。</p><div id="candidateRows"></div><pre id="candidateChanges"></pre><button id="closeCandidates">閉じる</button></dialog>
<dialog id="fullscreenPrompt"><h2>全画面表示にしますか？</h2><div class="actions"><button id="fullscreenNo">このまま使う</button><button id="fullscreenYes" class="primary">全画面にする</button></div></dialog>
<script type="module" src="app.mjs?v=20260921-redimport1"></script></body></html>
